workflows:
  ios-altstore:
    name: iOS unsigned build (for AltStore sideload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS app (unsigned — AltServer signs it locally with your free Apple ID)
        script: |
          flutter build ios --release --no-codesign
      - name: Package into an .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r gamelib-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/gamelib-unsigned.ipa
